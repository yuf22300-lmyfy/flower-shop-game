<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>废土花店日记</title>
<style>
:root{
  --bg:#efe3cd; --paper:#faf3e3; --panel:#f6ecd8; --ink:#3d3529; --ink2:#6f6250;
  --acc:#c25b3d; --acc2:#a34a30; --sage:#7d9b72; --sage2:#5c7a55; --gold:#bd9245;
  --slate:#5a6b7a; --slate2:#3f4d59; --line:#d9c9a8; --card:#fffdf6;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background-image:radial-gradient(circle at 20% 10%,rgba(255,250,235,.7),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(206,184,140,.35),transparent 45%);
}
#app{max-width:1280px;margin:0 auto;padding:10px 12px 20px;display:none;flex-direction:column;min-height:100vh;gap:10px}
/* ---------- 顶栏 ---------- */
#hdr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;
  box-shadow:0 2px 8px rgba(90,70,40,.08)}
#hdr .title{font-size:20px;font-weight:800;letter-spacing:2px;color:var(--acc2)}
#hdr .title small{display:block;font-size:11px;font-weight:400;color:var(--ink2);letter-spacing:4px}
#shopName{font-size:12px;color:var(--sage2);background:#eef2e6;border-radius:8px;padding:2px 8px}
#dayBox{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px 10px;text-align:center;min-width:64px}
.chip b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.chip span{font-size:11px;color:var(--ink2)}
.chip.atmo b{color:var(--acc)}
.chip.frag b{color:var(--slate)}
#phaseBox{font-size:13px;color:var(--ink2)}
#phaseBox b{color:var(--ink);font-size:15px}
#weather{font-size:14px}
#tools{display:flex;gap:6px}
.mini{font-size:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink2);
  border-radius:8px;padding:3px 9px;cursor:pointer}
.mini:hover{background:#f0e2c6}
/* ---------- 主区 ---------- */
#main{display:flex;gap:12px;flex:1;min-height:0}
#left{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
#log{flex:1;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:18px 22px;min-height:340px;max-height:calc(100vh - 250px);
  background-image:repeating-linear-gradient(0deg,transparent,transparent 30px,rgba(190,170,130,.12) 31px);
  font-family:"KaiTi","STKaiti","SimSun",serif;font-size:17px;line-height:1.85;scroll-behavior:smooth}
.msg{margin-bottom:14px;animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.msg.narr{color:var(--ink)}
.msg.sys{color:var(--ink2);font-size:15px;font-family:"Microsoft YaHei",sans-serif;
  border-left:3px solid var(--line);padding-left:10px}
.msg.me{color:var(--sage2)}
.msg.say{color:var(--ink)}
.msg .who{display:inline-block;font-family:"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;
  background:var(--sage);color:#fff;border-radius:6px;padding:1px 8px;margin-right:8px;vertical-align:2px}
.msg.me .who{background:var(--acc)}
.msg.dark{color:var(--slate2);background:rgba(90,107,122,.08);border-left:3px solid var(--slate);
  padding:8px 12px;border-radius:0 8px 8px 0}
.msg.clue{color:#6b4f14;background:rgba(189,146,69,.12);border:1px dashed var(--gold);
  border-radius:8px;padding:8px 12px}
.msg.gain{color:var(--sage2);font-family:"Microsoft YaHei",sans-serif;font-size:15px}
.msg .art{text-align:center;margin:8px 0 4px}
.msg .art svg{max-width:min(420px,100%);height:auto}
.daymark{text-align:center;color:var(--acc2);font-family:"Microsoft YaHei",sans-serif;font-weight:800;
  letter-spacing:6px;margin:22px 0 12px;font-size:15px}
.daymark:before,.daymark:after{content:"· · ·";letter-spacing:2px;color:var(--line);margin:0 12px}
/* ---------- 选项 ---------- */
#choices{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;
  display:flex;flex-direction:column;gap:8px}
#choices .tip{font-size:12px;color:var(--ink2)}
.btn{font-family:"KaiTi","STKaiti","SimSun",serif;font-size:17px;text-align:left;
  background:linear-gradient(180deg,#fffdf6,#f7ecd4);border:1px solid var(--line);
  border-left:5px solid var(--sage);border-radius:10px;padding:10px 14px;cursor:pointer;
  color:var(--ink);transition:transform .12s,box-shadow .12s;line-height:1.5}
.btn:hover{transform:translateX(4px);box-shadow:0 3px 10px rgba(120,90,50,.18);border-left-color:var(--acc)}
.btn .tag{display:inline-block;font-family:"Microsoft YaHei",sans-serif;font-size:12px;font-weight:700;
  color:#fff;background:var(--sage2);border-radius:6px;padding:0 7px;margin-right:8px;vertical-align:2px}
.btn.warn .tag{background:var(--acc)}
.btn.dark .tag{background:var(--slate)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn small{display:block;font-size:13px;color:var(--ink2)}
#quickBar{display:flex;gap:8px;flex-wrap:wrap}
#quickBar .btn{font-size:15px;padding:7px 12px}
/* ---------- 右侧面板 ---------- */
#side{width:372px;display:flex;flex-direction:column;gap:10px;min-height:0}
#tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{flex:1;text-align:center;font-size:13px;padding:7px 4px;background:var(--panel);
  border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;cursor:pointer;
  color:var(--ink2);white-space:nowrap}
.tab.on{background:var(--card);color:var(--acc2);font-weight:800}
#panel{background:var(--card);border:1px solid var(--line);border-radius:0 12px 12px 12px;
  padding:12px;overflow-y:auto;max-height:calc(100vh - 215px);font-size:14px}
#panel h4{font-size:13px;color:var(--ink2);margin:10px 0 6px;font-weight:700;letter-spacing:1px}
.potgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pot{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer}
.pot:hover{border-color:var(--sage)}
.pot .ic{height:52px;display:flex;align-items:flex-end;justify-content:center}
.pot .nm{font-size:13px;font-weight:700;margin-top:3px}
.pot .st{font-size:11px;color:var(--ink2);line-height:1.5}
.pot.ready{border-color:var(--gold);box-shadow:0 0 6px rgba(189,146,69,.35)}
.pot.dry{border-color:#c9856a}
.pot.mate{border-color:var(--sage);box-shadow:0 0 6px rgba(125,155,114,.4)}
.row{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;margin-bottom:8px}
.row .grow{flex:1;min-width:0}
.row b{font-size:14px}
.row .sub{font-size:12px;color:var(--ink2);line-height:1.5}
.hearts{color:var(--acc);font-size:13px;letter-spacing:1px;white-space:nowrap}
.hearts .off{color:#d8c9a6}
.clueRow{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.clueRow .no{font-family:"Microsoft YaHei";font-weight:800;font-size:13px;color:#fff;background:var(--slate);
  border-radius:6px;padding:2px 7px;min-width:34px;text-align:center}
.clueRow.on .no{background:var(--gold)}
.clueRow .nm{font-weight:700}
.clueRow .src{font-size:12px;color:var(--ink2)}
.clueRow.off{opacity:.45}
.invgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.item b{display:block;font-size:13px}
.item small{color:var(--ink2);font-size:11px;line-height:1.4;display:block}
.item.fn{border-color:var(--gold)}
.bar{height:10px;background:#e8dcc2;border-radius:6px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--gold));border-radius:6px;transition:width .5s}
.news{font-size:13px;color:var(--ink2);background:var(--paper);border:1px dashed var(--line);
  border-radius:8px;padding:8px 10px;margin-top:8px;font-family:"SimSun",serif}
.dim{color:var(--ink2);font-size:12px}
.locked{filter:grayscale(.6);opacity:.6}
/* ---------- 全屏层 ---------- */
.overlay{position:fixed;inset:0;background:rgba(62,52,38,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
.card{position:relative;background:var(--paper);border:1px solid var(--gold);border-radius:18px;max-width:640px;width:100%;
  padding:30px 34px;max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(40,30,15,.4)}
.cardclose{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink2);font-size:15px;cursor:pointer;font-family:"Microsoft YaHei",sans-serif}
.cardclose:hover{background:#ecdcbc;color:var(--acc2)}
.card h2{font-size:24px;color:var(--acc2);margin-bottom:4px;letter-spacing:3px}
.card .sub2{color:var(--ink2);font-size:14px;margin-bottom:14px}
.card p{font-family:"KaiTi","STKaiti",serif;font-size:17px;line-height:1.9;margin-bottom:12px}
.card .btn{width:100%;margin-top:8px}
#title{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:linear-gradient(180deg,#f7eeda 0%,#eadfc4 55%,#e2d3b0 100%);text-align:center;padding:20px}
#title h1{font-size:42px;letter-spacing:10px;color:var(--acc2);font-family:"KaiTi","STKaiti",serif;
  text-shadow:0 2px 0 #fff}
#title .tag2{color:var(--ink2);letter-spacing:2px;font-size:14px}
#title .btn{width:260px;text-align:center;font-size:18px}
#title .ver{position:absolute;bottom:14px;right:20px;font-size:12px;color:#b7a67f}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.endcard{background:linear-gradient(180deg,#faf3e3,#efe0c2)}
.endcard .emo{font-size:52px}
.hint{font-size:12px;color:#a08c5f;margin-top:6px;font-family:"Microsoft YaHei"}
#panelToggle{display:none;position:fixed;right:14px;bottom:96px;z-index:46;width:54px;height:54px;border-radius:50%;
  background:var(--acc);color:#fff;font-size:24px;border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer;line-height:1}
@media (max-width:960px){
  #main{flex-direction:column}
  #side{width:100%}
  #panel{max-height:420px}
  #log{max-height:none}
}
@media (max-width:700px){
  body{padding:0;-webkit-text-size-adjust:100%}
  #app{padding:6px 8px 8px;gap:6px}
  #hdr{padding:8px 10px;gap:6px}
  #hdr .title{font-size:16px;letter-spacing:1px}
  #hdr .title small{font-size:9px;letter-spacing:2px}
  .chip{min-width:48px;padding:2px 5px}
  .chip b{font-size:16px}
  .chip span{font-size:10px}
  #dayBox{gap:5px}
  #tools{width:100%;justify-content:flex-end;margin-left:0}
  .mini{padding:6px 10px;font-size:13px}
  #main{flex-direction:column;gap:6px}
  #log{font-size:16px;line-height:1.9;padding:12px 14px;min-height:180px;max-height:36vh}
  #choices{position:sticky;bottom:0;padding:8px;box-shadow:0 -4px 14px rgba(90,70,40,.15)}
  .btn{font-size:16px;padding:12px 12px}
  #quickBar .btn{font-size:14px;padding:8px 10px}
  #side{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;max-height:72vh;z-index:45;
    background:var(--panel);transform:translateY(105%);transition:transform .25s ease-out;
    border-radius:18px 18px 0 0;box-shadow:0 -8px 28px rgba(40,30,15,.4);padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  body.sheet-open #side{transform:translateY(0)}
  #tabs .tab{padding:9px 4px;font-size:13px}
  #panel{max-height:calc(72vh - 64px);border-radius:0 10px 10px 10px}
  .potgrid{grid-template-columns:repeat(3,1fr)}
  #panelToggle{display:block}
  .card{max-width:94vw;padding:18px 14px}
  .card h2{font-size:20px}
  .card p{font-size:16px}
  #title h1{font-size:30px;letter-spacing:6px}
  #title .tag2{font-size:12px}
  #title .btn{width:230px;font-size:16px}
  .overlay{padding:10px}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="title">
  <div id="titleArt"></div>
  <h1>废土花店日记</h1>
  <div class="tag2">末日温情 · 经营叙事 · 30天一个故事周期</div>
  <div class="tag2" style="font-size:13px;max-width:560px;line-height:1.8">
    在废土上开一间小花店，种花、修旧物、听陌生人讲故事——<br>顺便发现你自己遗忘的真相。
  </div>
  <button class="btn" id="btnNew" style="width:260px;text-align:center;font-size:18px">🌼 开始新的三十天</button>
  <button class="btn" id="btnCont" style="width:260px;text-align:center;display:none">📖 继续经营</button>
  <button class="btn" id="btnExit" style="width:260px;text-align:center">🌙 退出游戏</button>
  <div class="ver">v1.0 · 治愈系 · 不惊吓 · 不失败惩罚</div>
</div>

<div id="app">
  <div id="hdr">
    <div class="title">废土花店日记<small>WASTELAND&nbsp;FLORIST&nbsp;DIARY</small></div>
    <span id="shopName" style="display:none"></span>
    <div id="dayBox">
      <span id="weather"></span>
      <div id="phaseBox"><b id="dayNo">第 1 天</b><br><span id="phaseName">早晨</span></div>
      <div class="chip"><b id="stWater">5</b><span>净水 💧</span></div>
      <div class="chip"><b id="stParts">3</b><span>零件 🔧</span></div>
      <div class="chip"><b id="stSeeds">3</b><span>种子 🌰</span></div>
      <div class="chip atmo"><b id="stAtmo">0</b><span>氛围值 ✿</span></div>
      <div class="chip"><b id="stInv">0/10</b><span>背包 🎒</span></div>
      <div class="chip frag"><b id="stFrag">0</b><span>真相碎片 ◈</span></div>
    </div>
    <div id="tools">
      <button class="mini" id="btnMute">🔊 音效</button>
      <button class="mini" id="btnHelp">？玩法</button>
      <button class="mini" id="btnRestart">重新开始</button>
      <button class="mini" id="btnQuit">⏻ 退出</button>
    </div>
  </div>

  <div id="main">
    <div id="left">
      <div id="log"></div>
      <div id="choices"><div class="tip">……</div></div>
    </div>
    <div id="side">
      <div id="tabs">
        <div class="tab on" data-t="pots">花架</div>
        <div class="tab" data-t="cust">顾客</div>
        <div class="tab" data-t="relic">旧物柜</div>
        <div class="tab" data-t="clue">线索册</div>
        <div class="tab" data-t="diary">日记本</div>
        <div class="tab" data-t="inv">背包</div>
      </div>
      <div id="panel"></div>
    </div>
  </div>
</div>

<div class="overlay" id="modal" style="display:none">
  <div class="card" id="modalCard"></div>
</div>


<script>
'use strict';
/* ================= 工具 ================= */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function rnd(){return Math.random()}
function ri(n){return Math.floor(Math.random()*n)}
function pick(a){return a[ri(a.length)]}
function has(o,k){return Object.prototype.hasOwnProperty.call(o,k)}
function clone(o){var r={},k;for(k in o)if(has(o,k))r[k]=o[k];return r}
/* ================= 植物图鉴 ================= */
/* ic:{f:花形 c:花色 s:茎叶色} f: clump草簇 frond蕨叶 bell铃兰 trump喇叭 spike刺球 star星芒 bulb灯泡 vine藤 droop垂枝 */
var PLANTS={
 moss:{n:'发光苔藓',t:0,r:1,d:'一小片幽幽的绿光,夜里能照亮半张桌子。',ic:{f:'clump',c:'#9fe08a',s:'#6fae7f'}},
 fern:{n:'铁线蕨',t:0,r:1,d:'叶子细得像铅笔稿,却怎么压都压不坏。',ic:{f:'frond',c:'#7fae8a',s:'#4f7a5c'}},
 horn:{n:'喇叭花',t:0,r:1,d:'清晨朝着太阳吹无声的号,午后悄悄合上。',ic:{f:'trump',c:'#e8875a',s:'#6f9a5f'}},
 cact:{n:'多刺仙人掌',t:0,r:1,d:'浑身是刺,开的花却软得像一句晚安。',ic:{f:'spike',c:'#8fb573',s:'#6d9460'}},
 viol:{n:'紫罗兰',t:0,r:1,d:'废土上最固执的香气,有人闻了会突然安静。',ic:{f:'bell',c:'#9a7ab8',s:'#5f8a5f'}},
 myst:{n:'神秘种子',t:0,r:5,d:'不知道会长出什么。种它的人都有点贪心,或者有点寂寞。',ic:{f:'star',c:'#c9b458',s:'#8a9a6f'}},
 lant:{n:'夜光灯笼',t:1,r:2,d:'雾再大,它也亮着。有它在,辐射雾天也能开门做生意。',ic:{f:'bulb',c:'#ffd97a',s:'#7d9b72'},fx:'fogOpen'},
 echo:{n:'回声花',t:1,r:3,d:'会把附近的声响存起来,慢慢放给你听。偶尔,放出的不是这里的声音。',ic:{f:'bell',c:'#a8c4c9',s:'#6f9a8a'},fx:'echo'},
 vine:{n:'净水藤',t:1,r:4,d:'藤蔓里滤出清亮的水,每天存下两罐——到花架上点它「采收」。',ic:{f:'vine',c:'#8ad0c0',s:'#5f9a80'},fx:'water2'},
 mem:{n:'记忆花',t:1,r:4,d:'凑近去闻,会想起一些不属于你的事。',ic:{f:'star',c:'#c9a1c4',s:'#7a8a6f'},fx:'sniff'},
 cotton:{n:'柔刺棉',t:1,r:3,d:'刺是软的,棉是暖的。每三天结出一块防辐射布。',ic:{f:'clump',c:'#e8e0d0',s:'#8aa578'},fx:'cloth'},
 star:{n:'星尘苔藓',t:1,r:2,d:'入夜后撒出细碎的光点,夜里店里的温柔翻倍。',ic:{f:'clump',c:'#b8d0e8',s:'#7d9b72'},fx:'night2'},
 ring:{n:'鸣响果',t:1,r:3,d:'敲一下,咚——像很远的地方有人应了一声。乐手见了走不动路。',ic:{f:'bulb',c:'#d9a05a',s:'#6f9a5f'},fx:'gift5music'},
 prism:{n:'彩光刺',t:1,r:3,d:'刺尖上折出七种颜色,收藏家愿意为一眼走十里废土。',ic:{f:'spike',c:'#e8a1b8',s:'#6d9460'},fx:'collector'},
 needle:{n:'指针花',t:2,r:4,d:'无论怎么转盆,花永远指着同一个方向。那边什么都没有。',ic:{f:'star',c:'#cfd8bc',s:'#8a9a6f'},fx:'point'},
 tomato:{n:'会说话的番茄',t:2,r:5,d:'每天说一句俏皮话。它觉得自己是店里真正的店长。',ic:{f:'trump',c:'#e05a4a',s:'#6f9a5f'},fx:'quip'},
 bulb:{n:'灯泡藤蔓',t:2,r:3,d:'结出的果实真的会亮。停电的废土,它是最小的太阳。',ic:{f:'bulb',c:'#ffe89a',s:'#8aa578'},fx:'light'},
 choco:{n:'巧克力土',t:2,r:3,d:'土壤散发着甜味。小孩和某些大人为它排队。',ic:{f:'clump',c:'#a5795a',s:'#8a7a6f'},fx:'sweet'},

  var nb=null;if(S.pots[i-1]&&!S.pots[i-1].tag&&S.pots[i-1].pl===h.b&&S.pots[i-1].st===2&&!(S.pots[i-1].cd>0))nb=i-1;

function pickVisitors(preview){
 var cid,need=[];
 if(!S.script.vBaba&&S.day>=2){need.push('baba');S.script.vBaba=1}
 else if(!S.script.vPu&&S.day>=4){need.push('pu');S.script.vPu=1}
 else if(!S.script.vNyura&&S.day>=5){need.push('nyura');S.script.vNyura=1}
 if(!clueHas('06')&&S.day>=6&&S.fav.vera.seen<3)need.push('vera');
 if(!clueHas('07')&&S.day>=7&&S.fav.ivan.seen<2)need.push('ivan');
 if(!S.flags.musicbox_q&&S.fav.baba.seen<2&&S.day>=3)need.push('baba');
 if(!S.script.vPavel&&S.day>=8){need.push('pavel');S.script.vPavel=1}
 if(!clueHas('08')&&S.day>=9&&S.fav.pavel.seen<4)need.push('pavel');
 var uniq=[],i;for(i=0;i<need.length;i++)if(uniq.indexOf(need[i])<0)uniq.push(need[i]);
 need=uniq;
 function randOther(){
  var pool=[],k;for(k in CUST)if(need.indexOf(k)<0)pool.push(k);
  var w=[],j;for(j=0;j<pool.length;j++){cid=pool[j];
   var weight=1+S.fav[cid].lv*0.4+(S.dog?0.3:0)+(hasPot('prism',2)&&cid==='vera'?1:0)+(hasPot('choco',2)&&cid==='nyura'?1:0);
   w.push({c:cid,w:weight})}
  var tw=0;for(j=0;j<w.length;j++)tw+=w[j].w;var r=rnd()*tw;
  for(j=0;j<w.length;j++){r-=w[j].w;if(r<=0)return w[j].c}
  return w[0].c;
 }
 if(need.length===0)need.push(randOther());
 if(need.length===1&&rnd()<(has(S.unlocked,'stove')?0.65:0.45)+(S.dog?0.15:0))need.push(randOther());
 if(preview){var names=[];for(i=0;i<need.length;i++)names.push(CUST[need[i]].n);return names}
 return need;
}

function tradeOffer(cid,done){
 var c=CUST[cid],i,offer=null,itemId=null;
 if(!S.giftToday)S.giftToday={};
 if(!S.tradeToday[cid]){
  for(i=0;i<c.w.length;i++){itemId=hasCat(c.w[i]);if(itemId){break}}
  if(itemId)offer=itemId;
 }
 var wtxt=c.w.map(wantName).join('/');
 var render=function(){
 var flowerId=hasCat('nyura')||hasCat('purple')||hasCat('flower');
 var opts=[];
 if(offer){
  var it=ITEMS[offer];
  opts.push({h:'交换:拿出「'+it.n+'」',s:c.n+'想要:'+wtxt+' · 好感也会升温',tag:'以物易物',k:'trade'});
 }else{
  opts.push({h:'(交换)'+c.n+'想要:'+wtxt+'——你今天没有这些',s:'花架采摘、旧物、零食都能拿来换',tag:'以物易物',k:'no',d:true});
  if(!S.flags.beatAskedNone)opts.push({h:'问一问:"今天想带点什么走吗?"',s:'先问问,才知道能不能帮上 · 氛围+1',tag:'招呼',k:'nogoods'});
 }
 if(!S.giftToday[cid]){
  if(flowerId){
   opts.push({h:'送一束「'+ITEMS[flowerId].n+'」(不图交换)',s:'一份心意 · 好感+2 氛围+2',tag:'送花',k:'gift'});
  }else{
   opts.push({h:'送一束花(背包里没有花)',s:'花架上的花成熟后,采摘就能送人',tag:'送花',k:'noflower',d:true});
  }
 }
 opts.push({h:'目送对方离开',k:'bye'});
 setChoices('交易 · '+c.n,opts,function(k){
  if(k==='no'||k==='noflower')return;
  if(k==='nogoods'){
   meSay('你问:"今天想带点什么走吗?"');
   say(cid,NOGOODS[cid]);
   atmoGain(1);save();
   setChoices('客人体谅地笑了笑。',[{h:'目送对方离开',k:'bye'}],function(){finishVisit(cid,done)});
   return;
  }
  if(k==='gift'){
   S.giftToday[cid]=1;
   removeItem(flowerId,1);
   if(cid==='pu'&&flowerId==='nyurabloom'){
    meSay('你把「纽拉的花束」递给老普:"纽拉种的。她说,开出来的第一束,要送给一个重要的人。"');
    if(!S.flags.pu_grand){
     S.flags.pu_grand=1;
     dark('老普捧着花,凑近,闻了一下——忽然,浑身轻轻一震,像被很旧的电流过了一遍。');
     dark('"……这个香气。"他的声音哑了,"很多年前,我抱着一个小姑娘睡觉。她睡熟以后,满屋子就是这个味道。她管我叫——"他停在那两个字跟前,像被烫了一下,再也迈不过去。"想不起来了。"他红着眼眶,把那束花抱在胸口,"为什么会,想不起来?"');
     gain('(老普把花,别在了大衣最里面的一颗扣子上)');
     addFrag();
    }else{
     dark('他又闻了一次那束花,又一次,停在同一条门槛前——离那两个字,只差半步。');
    }
    favGain(cid,3);atmoGain(2);updHud();save();
    setChoices('老普抱着那束花,像抱着一点够不着的光。',[{h:'目送对方离开',k:'bye'}],function(){finishVisit(cid,done)});
    return;
   }
   meSay('你把「'+ITEMS[flowerId].n+'」轻轻推了过去:"送给你的。不换什么。"');
   say(cid,GIFTFLOWER[cid]);
   gain('('+ITEMS[flowerId].n+' ×1 送出)');
   favGain(cid,2);atmoGain(2);updHud();save();
   setChoices('花送出去了。',[{h:'目送对方离开',k:'bye'}],function(){finishVisit(cid,done)});
   return;
  }
  if(k==='trade'){
   S.tradeToday[cid]=1;removeItem(offer,1);
   if(offer==='quip'){
    if(!S.flags['quip_'+cid]){S.flags['quip_'+cid]=1;say(cid,QUIPREACT[cid]||QUIPREACT._);atmoGain(1)}
    else say(cid,pick(['又咬了一口俏皮果,又笑了一次。','第二颗俏皮果,吃得心安理得。']));
   }else{
    var rl;
    if(offer==='pencil')rl=TRADEREACT_PENCIL[cid]||TRADEREACT_ID.pencil;
    else rl=TRADEREACT_ID[offer]||TRADEREACT[ITEMS[offer].cat];
    if(rl)say(cid,rl);
   }
   var t=pick(c.trades);
   if(t.g.res==='parts'){S.parts+=t.g.q;gain(t.l+'(零件+'+t.g.q+')')}
   else if(t.g.res==='water'){S.water+=t.g.q;gain(t.l+'(净水+'+t.g.q+')')}
   else if(t.g.res==='seeds'){if(t.g.myst){S.myst+=t.g.q;gain(t.l+'(神秘种子+'+t.g.q+')')}else{S.seeds+=t.g.q;gain(t.l+'(种子+'+t.g.q+')')}}
   else if(t.g.item){addItem(t.g.item,1);gain(t.l)}
   if(S.tools.earp){S.parts+=1;gain('(耳机里,你听见他/她心里的底价:"其实还想多给一点。")——零件+1')}
   favGain(cid,1);S.counters.trade++;updHud();
   setChoices('交易完成。',[{h:'目送对方离开',k:'bye'}],function(){finishVisit(cid,done)});
   return;
  }
  finishVisit(cid,done);
 });
 };
 render();CHOICE_REFRESH=render;
}

function evening(){
 S.phase=2;updHud();
 settle();growPass();
 rollEvents();
 eveningActions();
}
function settle(){
 var at=0,i,p;
 for(i=0;i<S.pots.length;i++){p=S.pots[i];
  if(!p)continue;
  if(p.cd>0)p.cd--;
  if(p.st!==2)continue;
  if(p.pl==='chime'){at+=1}
  if(p.pl==='star')at+=2;
  if(p.pl==='pin')at+=1;
  if(p.pl==='tomato')at+=1;
 }
 if(S.tools.gram&&S.tools.vinyl){at+=2;if(S.tools.need)at+=1}
 if(S.tools.lamp&&has(S.unlocked,'lampPost'))at+=1;
 if(S.tools.flask)S.water+=1;
 if(S.tape)at+=1;
 if(has(S.unlocked,'yard')){S.water+=2;if(rnd()<0.6){addItem('egg',1);gain('后院的母鸡留下一枚蛋,得意地叫了两声。')}
  if(S.day-(S.flags.yardDay||S.day)>=10){addItem('apple',1);gain('后院的小树,结出了第一捧果子。')}}
 if(has(S.unlocked,'cabinet')){S.cabTick++;if(S.cabTick>=5){S.cabTick=0;if(rnd()<0.5){narr('展示柜前,一位路过的客人站了很久,轻轻说了一句什么。');addFrag()}}}
 if(S.tools.logbook){S.logTick++;if(S.logTick>=3){S.logTick=0;if(rnd()<0.5){narr('巡检记录簿无风自动,翻到一页新的。');addFrag()}}}
 if(at>0){atmoGain(at);gain('夜里的店安安静静地亮着。氛围值 +'+at+'。')}
 updHud();
}

var FX={ps:[],ash:0,t:0};
function fxLoop(){
 var cv=$('fx');if(!cv)return;
 var dpr=window.devicePixelRatio||1;
 cv.width=window.innerWidth*dpr;cv.height=window.innerHeight*dpr;
 cv.style.width=window.innerWidth+'px';cv.style.height=window.innerHeight+'px';
 var ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
 var cols=['#e8b4c8','#f2d5a0','#c8e0c0','#e8dcc8'];
 var i;for(i=0;i<26;i++)FX.ps.push({x:rnd()*1,y:rnd(),v:0.15+rnd()*0.35,r:2+rnd()*3,c:cols[i%4],ph:rnd()*6.28});
 function step(){
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  FX.t+=0.016;FX.ash=Math.max(0,FX.ash-0.016);
  var ashMode=FX.ash>0;
  for(i=0;i<FX.ps.length;i++){var p=FX.ps[i];
   p.y+=p.v*(ashMode?0.4:1)*0.004;p.x+=Math.sin(FX.t+p.ph)*0.0012+(ashMode?0:0.0006);
   if(p.y>1.05){p.y=-0.05;p.x=rnd()}
   var xx=p.x*window.innerWidth,yy=p.y*window.innerHeight;
   ctx.globalAlpha=ashMode?0.35:0.55;
   ctx.fillStyle=ashMode?'#9aa2ac':p.c;
   ctx.beginPath();ctx.ellipse(xx,yy,p.r,p.r*0.6,FX.t+p.ph,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(step);
 }
 step();
}

function selfTest(){
 TEST=true;AU.mute=true;
 window.onerror=function(m,u,l){REPORT.errors.push(m+' @'+l)};
 var _msg=msg;msg=function(){};var _dm=daymark;daymark=function(){};
 var _art=artMsg;artMsg=function(){};
 var _rp=refreshPanel;refreshPanel=function(){};
 var _up=updHud;updHud=function(){};
 var _set=setChoices;setChoices=function(){};
 var _mo=modal;modal=function(h,b){var o=autoPick(b);if(o){try{o.f()}catch(e){REPORT.errors.push('modal:'+e.message)}}};
 var _end=endCard;endCard=function(html,btns){REPORT.runs.push({ending:S.ended,day:S.day,clues:S.clues.length,which:S.clues.join(','),frags:S.frags.length,atmo:S.atmo,pursuit:S.pursuit,cat:S.cat});};
 try{runPass('A')}catch(e){REPORT.errors.push('passA:'+(e.message||e))}
 try{runPass('B')}catch(e){REPORT.errors.push('passB:'+(e.message||e))}
 try{runPass('C')}catch(e){REPORT.errors.push('passC:'+(e.message||e))}
 TEST=false;
 msg=_msg;daymark=_dm;artMsg=_art;refreshPanel=_rp;updHud=_up;setChoices=_set;modal=_mo;endCard=_end;
 window.onerror=null;
 var ok=REPORT.errors.length===0&&REPORT.runs.length>=3;
 REPORT.ok=ok;
 try{console.log('SELFTEST '+(ok?'PASS':'FAIL'),JSON.stringify(REPORT))}catch(e){}
 window.__testReport=REPORT;
 return REPORT;
}
function autoPick(a){
 var live=[],i;if(!a)return null;
 for(i=0;i<a.length;i++){if(a[i]&&a[i].d)continue;live.push(a[i])}
 if(live.length===0)return null;
 return live[TT.n++%live.length];
}
function runPass(which){
 TT.n=0;
 newGame(true);
 S.testMode=true;
 var d;
 for(d=0;d<45;d++){
  if(S.ended)break;
  try{dayStep(which)}catch(e){REPORT.errors.push('day'+S.day+'['+which+']:'+(e.message||e)+' @@'+String(e.stack||'').split('\n').slice(1,3).join(' <= '));break}
 }
}
function dayStep(which){
 if(S.day===28&&!S.choice29)installTeaPatch(which);
 if(S.day===1){introScene();morningAuto();noonAuto();eveningAuto();return}
 if(S.day===3&&!S.cat){catArrival();if(!S.cat)return;morningAuto();noonAuto();eveningAuto();return}
 morningAuto();noonAuto();eveningAuto();
}
function installTeaPatch(which){
 var idxMap={A:0,B:1,C:2},pickIdx=has(idxMap,which)?idxMap[which]:0;
 var cur=modal;
 modal=function(h,b){
  if(h.indexOf('内心独白')>=0){
   var opt=b[Math.min(pickIdx,b.length-1)];modal=cur;opt.f();
  }else{cur(h,b)}};
}
function morningAuto(){
 var rota=['walk','fix','water','cat','dog'],k=rota[TT.n++%rota.length];
 var zi;
 if(potCount()===0&&S.seeds>0){for(zi=0;zi<S.potCap&&S.seeds>0;zi++){if(!S.pots[zi]){S.seeds--;S.pots[zi]={pl:pick(['moss','horn','viol']),st:0,w:0}}}}
 var crit=false;
 for(zi=0;zi<S.pots.length;zi++){var zp=S.pots[zi];if(zp&&zp.pl&&!zp.w&&(zp.tag?99:(WITHER_DAYS[zp.pl]||3))-(zp.miss||0)<=1)crit=true}
 if(crit&&S.water>=2){waterAll();return}
 if(crit&&S.water<2){walkAuto();return}
 if(anyThirsty()&&S.water>=2&&rnd()<0.8){waterAll();return}
 if(k==='walk'){walkAuto();return}
 if(k==='fix'){fixAuto();return}
 if(k==='water'){if(potCount()===0||S.water<2){walkAuto();return}waterAll();return}
 if(k==='cat'){if(!S.cat){walkAuto();return}if(!S.flags.catBadge&&S.day>=10){S.flags.catBadge=1;addClue('03')}else atmoGain(1);return}
 if(k==='dog'){if(!S.dog){walkAuto();return}atmoGain(1);return}
}
function walkAuto(){
 S.walks++;
 if(!S.tools.camera&&!S.script.foundCam&&S.walks>=3){S.script.foundCam=1;findRelicById('camera')}
 else if(S.tools.camera&&!S.tools.filmroll&&!S.script.foundRoll&&S.walks>=5){S.script.foundRoll=1;findRelicById('filmroll')}
 else if(rnd()<0.5)findRelicNext();
 else S.parts+=1;
 if(S.tools.camera&&S.tools.filmroll&&!clueHas('04')&&!S.script.usedRoll){S.tools.filmroll=false;S.script.usedRoll=1;addClue('04')}
}
function fixAuto(){
 if(S.flags.musicbox_q&&!S.flags.musicbox_fixed){S.parts=Math.max(S.parts,2);S.flags.musicbox_fixed=1;S.counters.fixed++;S.summary.fixed=(S.summary.fixed||[]).concat(['音乐盒'])}
 var p=pendingRelic();
 if(p&&S.parts>=1){
  S.parts-=1;var r=relById(p.id);
  S.relicFixed.push(r.id);S.tools[r.id]=1;S.counters.fixed++;
  S.summary.fixed=(S.summary.fixed||[]).concat([TOOLD[r.id].n]);
  if(r.id==='sack')S.invCap+=4;
 }
}

function visitAuto(cid){
 var c=CUST[cid],f=S.fav[cid];
 f.met=1;
 var idx=f.seen;
 if(idx<6&&beatOK(cid,idx)){
  var beat=c.beats[idx];if(beat.clue)addClue(beat.clue);
  var o=beat.opts[TT.n++%beat.opts.length];
  if(o.fav)favGain(cid,o.fav);if(o.atmo)atmoGain(o.atmo);if(o.flag)S.flags[o.flag]=1;
  if(o.clue)addClue(o.clue);if(o.frag)addFrag();
  f.seen++;
 }else{favGain(cid,1)}
 if(hasPot('lily',2)&&S.fav[cid].lv>=5&&!S.flags['lily_'+cid])S.flags['lily_'+cid]=1;
  var i;for(i=0;i<c.w.length;i++){var iid=hasCat(c.w[i]);if(iid){removeItem(iid,1);var t=c.trades[0],ti;
  if(cid==='baba'&&S.water<3){for(ti=0;ti<c.trades.length;ti++)if(c.trades[ti].g.res==='water'){t=c.trades[ti];break}}
  if(t.g.res==='parts')S.parts+=t.g.q;else if(t.g.res==='water')S.water+=t.g.q;else if(t.g.res==='seeds'){if(t.g.myst)S.myst+=t.g.q;else S.seeds+=t.g.q}else if(t.g.item)addItem(t.g.item,1);
  favGain(cid,1);S.counters.trade++;break}}
}
